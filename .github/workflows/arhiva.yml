name: Verificare și arhivă

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  arhiva:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifică sintaxa PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Construiește p45-carti-digitale.zip
        run: bash scripts/construieste-zip.sh

      - name: Atașează arhiva la versiunea publicată
        if: github.event_name == 'release'
        run: gh release upload "$TAG" dist/p45-carti-digitale.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
